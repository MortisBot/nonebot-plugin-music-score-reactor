[project]
name = "nonebot-plugin-music-score-reactor"
version = "0.1.0"
description = "Reaction to rhythm-game score screenshots using a configurable vision model"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["nonebot2>=2.5,<3", "nonebot-adapter-onebot>=2.4", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/MortisBot/nonebot-plugin-music-score-reactor"
Issues = "https://github.com/MortisBot/nonebot-plugin-music-score-reactor/issues"
Repository = "https://github.com/MortisBot/nonebot-plugin-music-score-reactor"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nonebot_plugin_music_score_reactor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
